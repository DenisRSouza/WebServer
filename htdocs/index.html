<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
  </head>
  <body>

    <h1>Central News</h1>
    <h2>Bem-vindo a fonte da verdade absoluta :)</h2>

    <section class="news-home">
    </section>

    <form method="POST" enctype="multipart/form-data" class="formulario-noticia" action="/criar-noticia">
      <h2>Criar nova noticia</h2>
      <br>

      <div class="campo">

        <label for="titulo">Título</label>
        <input
          type="text"
          id="titulo"
          name="titulo"
          placeholder="Baleia baleia baleia"
          required
        />

      </div>
      
      <div class="campo">

        <label for="descricao">Descrição</label>
        <input
          type="text"
          id="descricao"
          name="descricao"
          placeholder="Uma baleia baleou outra baleia 😱"
          required
        />
      </div>

      <div class="campo">
        <label for="body">Corpo do texto</label>
      
        <input
          type="text"
          id="body"
          name="body"
          placeholder="Uma balei pegou uma pistola modelo 8 milimetros, alvejou uma colega baleia azul, mirou e atinigiu a coitada."
          required
        />
      </div>
      
      <div class="campo">
        <label for="image">Escolha uma imagem</label>
        <input type="file" id="image" accept="image/*" name="image" required/>
      
        <button type="submit">Criar notícia</button>

      </div>
    </form>
  </body>
</html>
